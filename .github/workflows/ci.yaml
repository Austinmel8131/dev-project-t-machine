name: Complete DevOps Project Pipeline

on:
  push:
    branches:
      - main
    
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker Image
        run: | 
          docker build -f terraform-configs/Dockerfile -t austinmel8131/t-machine:${{ env.SHORT_SHA }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: austinmel8131
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push to Dockerhub
        run: |
          docker push austinmel8131/t-machine:${{ env.SHORT_SHA }}
      - name: Configure Git Author
        run: |
          git config --local user.email "austinmel8131@gmail.com"
          git config --local user.name "austinmel"
      - name: Update Helm Chart with new image tag
        run: |
          sed -i "s/tag:.*/tag: ${{ env.SHORT_SHA }}/" ./t-machine-project/values.yaml
          git add ./t-machine-project/values.yaml
          git commit -m "updated image tag to ${{ env.SHORT_SHA }}"
          git push 


