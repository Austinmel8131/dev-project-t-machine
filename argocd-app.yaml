apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:                
  name: t-machine-project
  namespace: argocd
spec:                   
  project: default
  source:
    repoURL: "https://github.com/Austinmel8131/dev-project-t-machine"
    targetRevision: HEAD     
    path: t-machine-project
  destination:
    server: "https://default.svc" 
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
